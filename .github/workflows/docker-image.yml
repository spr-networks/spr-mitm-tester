name: Docker Image CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate plugin and Compose files
        run: |
          python3 -m json.tool plugin.json >/dev/null
          python3 -m json.tool data/affected-tls.json >/dev/null
          python3 -m compileall -q scripts tests
          bash -n build_docker_compose.sh update-pins.sh scripts/startup.sh scripts/fetch-example-authority.sh
          SUPERDIR=/tmp/ docker compose -f docker-compose.yml config --quiet
          SUPERDIR=/tmp/ docker compose -f docker-compose-kvm.yml config --quiet
      - name: Test forged certificate acceptance
        run: python3 tests/run_acceptance.py
      - name: Test SPR sink contract
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  version:
    needs: acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: '0'
      - name: Bump version and push tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: anothrNick/github-tag-action@38e273cbdda80759cc0232a36f559999f4e47d29
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          INITIAL_VERSION: 0.0.0
          DEFAULT_BUMP: none
          BRANCH_HISTORY: last
      - name: Select image version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=latest
          if [[ "${{ github.event_name }}" == push && "${{ github.ref }}" == refs/heads/main ]]; then
            git fetch --tags origin
            tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
            version="${tag#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag: $tag" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  buildx:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      SUPERDIR: /tmp/
      RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v5
      - name: Load pinned build inputs
        run: grep -vE '^[[:space:]]*(#|$)' reproducible.env >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          name: spr-mitm-tester-builder
          driver-opts: image=${{ env.BUILDKIT_REF }}
      - name: Authenticate to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build pull request image
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: ./build_docker_compose.sh --set '*.platform=linux/amd64' --load
      - name: Test packaged request recording
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: python3 tests/run_packaged_smoke.py ghcr.io/spr-networks/spr-mitm-tester:latest
      - name: Build and publish main image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ./build_docker_compose.sh \
            --set '*.platform=linux/amd64,linux/arm64' \
            --set '*.tags=ghcr.io/spr-networks/spr-mitm-tester:latest' \
            --set "*.tags=ghcr.io/spr-networks/spr-mitm-tester:${RELEASE_VERSION}" \
            --set "*.tags=ghcr.io/spr-networks/spr-mitm-tester:sha-${GITHUB_SHA}" \
            --set "*.labels.org.supernetworks.version=${RELEASE_VERSION}" \
            --push
      - name: Verify clean install starts without authority config
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 tests/smoke_clean_start.py "ghcr.io/spr-networks/spr-mitm-tester:sha-${GITHUB_SHA}"
      - name: Test published request recording
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 tests/run_packaged_smoke.py "ghcr.io/spr-networks/spr-mitm-tester:sha-${GITHUB_SHA}"
      - name: Resolve published image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect \
            ghcr.io/spr-networks/spr-mitm-tester:latest \
            --format '{{.Manifest.Digest}}')
          test "${digest#sha256:}" != "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Install Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3.6.0
      - name: Generate SLSA provenance predicate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cat > /tmp/predicate.json <<EOF
          {
            "buildDefinition": {
              "buildType": "https://actions.github.io/buildtypes/workflow/v1",
              "externalParameters": {
                "workflow": {
                  "ref": "${{ github.ref }}",
                  "repository": "${{ github.server_url }}/${{ github.repository }}",
                  "path": ".github/workflows/docker-image.yml"
                }
              },
              "internalParameters": {
                "github": {
                  "event_name": "${{ github.event_name }}",
                  "repository_id": "${{ github.repository_id }}",
                  "repository_owner_id": "${{ github.repository_owner_id }}"
                }
              },
              "resolvedDependencies": [{
                "uri": "git+${{ github.server_url }}/${{ github.repository }}@${{ github.ref }}",
                "digest": { "gitCommit": "${{ github.sha }}" }
              }]
            },
            "runDetails": {
              "builder": {
                "id": "${{ github.server_url }}/${{ github.repository }}/.github/workflows/docker-image.yml@${{ github.ref }}"
              },
              "metadata": {
                "invocationId": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"
              }
            }
          }
          EOF
      - name: Attest and verify published image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/spr-networks/spr-mitm-tester@${{ steps.digest.outputs.digest }}
        run: |
          cosign attest --yes --type slsaprovenance1 \
            --predicate /tmp/predicate.json "$IMAGE"
          cosign verify-attestation --type slsaprovenance1 \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/spr-networks/spr-mitm-tester/\.github/workflows/docker-image\.yml@' \
            "$IMAGE" >/dev/null
